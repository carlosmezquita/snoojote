name: Security monitoring

on:
    schedule:
        - cron: '17 7 * * *'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: security-monitoring
    cancel-in-progress: false

jobs:
    dependencies:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile --ignore-scripts
            - run: bun run audit
    vps:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        environment: production
        outputs:
            findings: ${{ steps.check.outputs.findings }}
        steps:
            - name: Check VPS without restarting services
              id: check
              env:
                  SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
                  KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
                  VPS_HOST: ${{ vars.VPS_HOST }}
              run: |
                  set -euo pipefail
                  umask 077
                  install -m 700 -d ~/.ssh
                  trap 'rm -f ~/.ssh/security_key' EXIT
                  test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" && test -n "$VPS_HOST"
                  printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/security_key
                  printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
                  status=0
                  output=$(ssh -i ~/.ssh/security_key -o IdentitiesOnly=yes \
                    -o BatchMode=yes -o StrictHostKeyChecking=yes \
                    -o ConnectTimeout=15 -o ServerAliveInterval=15 \
                    -o ServerAliveCountMax=4 "snoojote@$VPS_HOST" security-check 2>&1) || status=$?
                  printf '%s\n' "$output"
                  {
                    echo 'findings<<SECURITY_FINDINGS'
                    printf '%s\n' "$output" | grep '^ATTENTION:' || true
                    echo SECURITY_FINDINGS
                  } >> "$GITHUB_OUTPUT"
                  exit "$status"
    alerts:
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        needs: [dependencies, vps]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        environment: production
        permissions: {}
        steps:
            - name: Restore security alert state
              uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              continue-on-error: true
              with:
                  path: ${{ runner.temp }}/snoojote-security-alert
                  key: security-alert-v1-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: security-alert-v1-
            - name: Send new security findings to Discord
              env:
                  DISCORD_WEBHOOK: ${{ secrets.DISCORD_SECURITY_WEBHOOK }}
                  DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
                  VPS_RESULT: ${{ needs.vps.result }}
                  VPS_FINDINGS: ${{ needs.vps.outputs.findings }}
                  ALERT_STATE: ${{ runner.temp }}/snoojote-security-alert/fingerprint
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  node --input-type=module <<'JS'
                  import { createHash } from 'node:crypto';
                  import { mkdir, readFile, writeFile } from 'node:fs/promises';
                  import { dirname } from 'node:path';

                  try {
                    const env = process.env;
                    const findings = [...new Set((env.VPS_FINDINGS ?? '').split(/\r?\n/)
                      .filter(line => line.startsWith('ATTENTION:')).map(line => line.trim()))].sort();
                    const healthy = env.DEPENDENCIES_RESULT === 'success' && env.VPS_RESULT === 'success';
                    // Unclassified failures remain visible because their cause may have changed.
                    const fingerprint = env.DEPENDENCIES_RESULT === 'success' &&
                      env.VPS_RESULT === 'failure' && findings.length
                      ? createHash('sha256').update(JSON.stringify(findings)).digest('hex')
                      : '';
                    const previous = await readFile(env.ALERT_STATE, 'utf8').catch(error => {
                      if (error.code !== 'ENOENT') throw error;
                      return '';
                    });
                    const saveState = async value => {
                      await mkdir(dirname(env.ALERT_STATE), { recursive: true });
                      await writeFile(env.ALERT_STATE, value, { mode: 0o600 });
                    };
                    if (healthy || (fingerprint && fingerprint === previous)) {
                      await saveState(healthy ? '' : fingerprint);
                      console.log(healthy ? 'Security checks passed.' : 'VPS findings unchanged. Discord alert suppressed.');
                      process.exit(0);
                    }
                    const url = new URL(env.DISCORD_WEBHOOK);
                    if (url.protocol !== 'https:' || url.hostname !== 'discord.com' ||
                        !/^\/api\/webhooks\/\d+\/[\w-]+$/.test(url.pathname)) {
                      throw new Error('Invalid webhook configuration');
                    }
                    url.searchParams.set('wait', 'true');
                    const content = [
                      '**Snoojote security needs attention**',
                      `Dependencies: ${env.DEPENDENCIES_RESULT}`,
                      `VPS: ${env.VPS_RESULT}`,
                      env.VPS_FINDINGS?.slice(0, 1000),
                      `Details: <${env.RUN_URL}>`,
                      'Reboots remain manual. These checks do not restart the bot.',
                    ].filter(Boolean).join('\n');
                    const response = await fetch(url, {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({ content, allowed_mentions: { parse: [] } }),
                      signal: AbortSignal.timeout(15000),
                    });
                    if (!response.ok) throw new Error('Webhook delivery failed');
                    await saveState(fingerprint);
                    console.log('Security alert delivered to the Discord alerts channel.');
                  } catch {
                    console.error('Discord alert delivery failed. Check the production webhook secret and Discord availability.');
                    process.exitCode = 1;
                  }
                  JS
            - name: Save security alert state
              uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: ${{ runner.temp }}/snoojote-security-alert
                  key: security-alert-v1-${{ github.run_id }}-${{ github.run_attempt }}
