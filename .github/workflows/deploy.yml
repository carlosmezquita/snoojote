name: Deploy VPS

on:
    workflow_run:
        workflows: [Quality]
        types: [completed]
        branches: [main]

permissions:
    contents: read

concurrency:
    group: snoojote-production
    cancel-in-progress: false

jobs:
    deploy:
        if: >-
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment: production
        steps:
            - name: Configure deployment SSH identity
              env:
                  SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
                  KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
              run: |
                  set -euo pipefail
                  test -n "$SSH_KEY"
                  test -n "$KNOWN_HOSTS"
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
                  printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
            - name: Deploy tested main revision
              env:
                  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
                  VPS_HOST: ${{ vars.VPS_HOST }}
              run: |
                  set -euo pipefail
                  [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
                  test -n "$VPS_HOST"
                  ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
                    -o BatchMode=yes -o StrictHostKeyChecking=yes \
                    -o ConnectTimeout=15 -o ServerAliveInterval=15 \
                    -o ServerAliveCountMax=4 "ubuntu@$VPS_HOST" "$DEPLOY_SHA"
            - name: Remove deployment identity
              if: always()
              run: rm -f ~/.ssh/deploy_key
